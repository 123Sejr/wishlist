<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Opret ny ønskeliste</title>
</head>
<body>

<div class="createListBox" align="center">
    <h1>Ny ønskeliste</h1>
    <form
        method="post"
        th:action="@{/{userId}/saveWishlist(userId=${userId})}"
    >
        <label >Navn:</label>
        <br />
        <input type="text" name="name" required>
        <br />
        <button type="submit">Gem</button>

        <!--<a th:href="@{/show-wishlists} ">
            <button type="button" th:value="${userId}">Tilbage</button>
        </a>-->
    </form>

    <form
            th:action="@{/show-wishlists}"
            method="get"
    >
        <button type="submit" th:value="${userId}">Tilbage</button>
    </form>
</div>

</body>
</html>
