<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/common.css}">
    <title>Rediger burger</title>
</head>
<body>
<form th:action="@{/{id}/update-user (id=${user.id})}"
        th:object="${user}"
        method="post">
    <label for="id"></label>
    <input id="id" th:value="${user.id}" hidden>
    <label for="name">Dit nyt navn</label><br>
    <input id="name" type="text" th:value="${user.name}" required>
    <br>
    <button type="submit">Bekræft nyt navn</button>
</form>



</body>
</html>
