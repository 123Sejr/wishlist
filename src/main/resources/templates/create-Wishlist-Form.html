<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div class="createListBox" align="center">
    <h1>Ny ønskeliste</h1>
    <form
        method="post"
        th:action="@{/saveWishlist}"
    >
        <label>Navn:</label>
        <br />
        <input type="text" name="name" required>
        <br />
        <button type="submit">Gem</button>
        <a th:href="@{/{userId}(userId=${userId})}">
            <button type="button">Tilbage</button>
        </a>
    </form>
</div>

</body>
</html>
