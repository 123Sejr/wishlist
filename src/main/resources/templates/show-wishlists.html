<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/common.css}">
    <link rel="stylesheet" th:href="@{/wishlists-style.css}">
    <title>Wishlists</title>
</head>
<body>
<header>
    <h1>1, 2, 3, Ønskeliste!</h1>
</header>
<main>
    <ul class="sidebar">
        <li>
            <a th:href="@{/{userId}/createWishlist(userId=${userId})}">Lav ny ønskeliste</a>
        </li>
        <li>
            <a th:href="@{/{userId}/edit-user(userId=${userId})}">Rediger bruger</a>
        </li>
        <li>
            <a th:href="@{/}">Tilbage</a>
        </li>
    </ul>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Navn</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(wishlists)}">
            <td colspan="4">Ingen ønskelister er oprettet</td>
        </tr>
        <tr th:each="wishlist : ${wishlists}">
            <td th:text="${wishlist.id}"></td>
            <td>
                <a th:href="@{/{wishlistId}/open-wishlist(wishlistId=${wishlist.id})}">
                    <p th:text="${wishlist.name}"></p>
                </a>
            </td>
            <td>
                <a th:href="@{/{wishlistId}/edit-wishlist-name(wishlistId=${wishlist.id})}">
                    <button type="button">Omdøb</button>
                </a>
            </td>
            <td>
                <form th:action="@{/{wishlistId}/delete-list(wishlistId=${wishlist.id})}"
                    method="post"> <!--Endpointet der sletter en hel liste-->
                    <button class="delete-button" type="submit">Slet</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</main>
</body>
</html>
