<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/common.css}">
    <link rel="stylesheet" th:href="@{/wishlists-style.css}">
    <title>Wishlists</title>
</head>
<header>
    <h1>1, 2, 3, Ønskeliste!</h1>
</header>
<body>
<main>
    <ul class="container">
        <li>
            <a th:href="@{/{userId}/createWishlist(userId=${userId})}">Lav ny ønskeliste</a>
        </li>
        <li>
            <form th:action="@{/{userId}/delete-user(userId=${userId})}"
                  method="post">
                <button type="submit">Slet brugeren</button>
            </form>
        </li>
        <li>
            <a th:href="@{/}">Tilbage</a>
        </li>
    </ul>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Navn</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(wishlists)}">
            <td colspan="4">Ingen ønskelister er oprettet</td>
        </tr>
        <tr th:each="wishlist : ${wishlists}">
            <td th:text="${wishlist.id}"></td>
            <td th:text="${wishlist.name}"></td>
            <td><a th:href="@{/{wishlistId}/open-wishlist(wishlistId=${wishlist.id})}">
                <!--Endpointet der viser ønskerne på den valgte liste-->
                <button type="button">Se ønskeliste</button>
            </a></td>
            <!--<td><a th:href="@{}"> Endpointet der giver lov til at redigere navnet på listen
                <button type="button">Rediger navn</button>
            </a></td>-->
            <td>
                <form th:action="@{/{wishlistId}/delete-list(wishlistId=${wishlist.id})}"
                    method="post"> <!--Endpointet der sletter en hel liste-->
                    <button type="submit">Slet</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</main>
</body>
</html>
