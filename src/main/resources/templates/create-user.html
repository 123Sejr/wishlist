<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/common.css}">
    <link rel="stylesheet" th:href="@{/simple-grid.css}">
    <title>Tilføj bruger</title>
</head>
<body>
<header>
    <h1>1, 2, 3, Ønskeliste!</h1>
</header>
<main>
    <div class="sidebar">
        <ul>
            <li>
                <a href="/" class="form-button">Tilbage til forsiden</a>
            </li>
        </ul>
    </div>
    <div class="content">
        <h1>Her kan man oprette en bruger</h1>
        <form action="/create-user" method="post">
            <label for="name">Dit navn</label><br>
            <input id="name" type="text" name="name" required>
            <br>
            <button type="submit">Opret</button>
        </form>
    </div>
</main>
</body>
</html>
