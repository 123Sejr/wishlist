<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">>
<head>
    <meta charset="UTF-8">
    <title>1, 2, 3, Ønskeseddel!</title>
    <style>
        h1 {
            color: darkmagenta;
            font-size: 28px;
        }
        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
        }
        .button {
            display: inline-block;
            padding: 8px 12px;
            background-color: lightblue;
            border: 1px solid gray;
            text-decoration: none;
            color: black;
        }


    </style>
</head>
<body>
<p>Her kan du oprette en ønskesedler og del dem med familie og venner.</p>
</body>
<p>Vælg en bruger fra listen</p>
<br>
<form action="/show-wishlists" method="get">
    <select name="userId">
        <option th:each="user : ${users}"
                th:value="${user.id}"
                th:text="${user.name}">
        </option>
    </select>
    <button type="submit">Vis lister</button>
</form>
<br>
<p>Eller opret en ny bruger:</p>
<br>
<a href="/create-user" class="button">Opret en ny bruger her</a>
</html>
